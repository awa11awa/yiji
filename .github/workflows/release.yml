name: Build and publish APK

on:
  push:
    branches: ['main']
    tags: ['v*']
    paths: ['app/build.gradle.kts']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yiji-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      YIJI_SIGNING_CERTIFICATE_SHA256: 041f228046082db2aaf03367fc29417b0620aadc45a4c5c05d42a08c579f0fea
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and existing release
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          text = pathlib.Path("app/build.gradle.kts").read_text()
          match = re.search(r'versionName\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', text)
          if not match:
              raise SystemExit("Missing or invalid versionName")
          version = match[1]
          tag = "v" + version
          if os.environ.get("GITHUB_REF_TYPE") == "tag" and os.environ["GITHUB_REF_NAME"] != tag:
              raise SystemExit("Pushed tag does not match versionName")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          result = subprocess.run(["gh", "release", "view", tag, "--json", "isDraft"], text=True, capture_output=True)
          if result.returncode and "release not found" not in result.stderr.lower() and "404" not in result.stderr:
              raise SystemExit(result.stderr)
          published = result.returncode == 0 and not json.loads(result.stdout)["isDraft"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\ntag={tag}\nsha={sha}\npublished={str(published).lower()}\n")
          print(f"Version: {tag}; already published: {published}")
          PY

      - uses: actions/setup-java@v4
        if: steps.version.outputs.published != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        if: steps.version.outputs.published != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          sdk = pathlib.Path(os.environ["ANDROID_HOME"])
          manager = sdk / "cmdline-tools/latest/bin/sdkmanager"
          subprocess.run([str(manager), "platforms;android-35", "build-tools;35.0.0"], input="y\n" * 100, text=True, check=True)
          PY

      - name: Restore fixed APK signing from encrypted repository secrets
        if: steps.version.outputs.published != 'true'
        env:
          YIJI_KEYSTORE_BASE64: ${{ secrets.YIJI_KEYSTORE_BASE64 }}
          YIJI_KEYSTORE_PASSWORD: ${{ secrets.YIJI_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          encoded = os.environ.get("YIJI_KEYSTORE_BASE64", "")
          password = os.environ.get("YIJI_KEYSTORE_PASSWORD", "")
          if not encoded or not password:
              raise SystemExit("Missing fixed signing secrets; refusing temporary signing.")
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "yiji-signing"
          directory.mkdir(mode=0o700, exist_ok=True)
          keystore = directory / "yiji-signing.p12"
          keystore.write_bytes(base64.b64decode("".join(encoded.split()), validate=True))
          keystore.chmod(0o600)
          def escape(value):
              return value.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r").replace(" ", "\\ ").replace("=", "\\=").replace(":", "\\:")
          properties = directory / "signing.properties"
          values = {"storeFile": str(keystore), "storeType": "PKCS12", "storePassword": password, "keyAlias": "yiji", "keyPassword": password}
          properties.write_text("".join(f"{key}={escape(value)}\n" for key, value in values.items()), encoding="utf-8")
          properties.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"YIJI_SIGNING_PROPERTIES={properties}\nYIJI_REQUIRE_STABLE_SIGNING=true\n")
          print("Fixed signing configuration restored.")
          PY

      - name: Test, lint and build
        if: steps.version.outputs.published != 'true'
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --max-workers=2 testReleaseUnitTest lintRelease assembleRelease

      - name: Prepare verified release assets
        if: steps.version.outputs.published != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ steps.version.outputs.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, shutil, subprocess, xml.etree.ElementTree as ET
          version, tag = os.environ["VERSION"], os.environ["TAG"]
          target = pathlib.Path("release-artifacts")
          target.mkdir(exist_ok=True)
          apk = target / f"yiji-{tag}.apk"
          shutil.copyfile("app/build/outputs/apk/release/app-release.apk", apk)
          tools = pathlib.Path(os.environ["ANDROID_HOME"]) / "build-tools/35.0.0"
          certificates = subprocess.check_output([str(tools / "apksigner"), "verify", "--print-certs", str(apk)], text=True)
          print(certificates)
          fingerprints = re.findall(r"Signer #\d+ certificate SHA-256 digest: ([a-fA-F0-9]+)", certificates)
          if [value.lower() for value in fingerprints] != [os.environ["YIJI_SIGNING_CERTIFICATE_SHA256"]]:
              raise SystemExit("APK signing certificate does not match the fixed v2.1.0 certificate")
          badging = subprocess.check_output([str(tools / "aapt"), "dump", "badging", str(apk)], text=True)
          if f"versionName='{version}'" not in badging:
              raise SystemExit("APK version does not match release tag")
          version_code = re.search(r'versionCode\s*=\s*(\d+)', pathlib.Path("app/build.gradle.kts").read_text())[1]
          if "name='cn.yiji.app'" not in badging or f"versionCode='{version_code}'" not in badging:
              raise SystemExit("APK package or versionCode does not match source")
          if any(line.startswith("application-debuggable") for line in badging.splitlines()):
              raise SystemExit("Refusing to publish a debuggable APK")
          source = target / f"yiji-{tag}-source.zip"
          subprocess.run(["git", "archive", "--format=zip", f"--prefix=yiji-{tag}/", "-o", str(source), os.environ["SOURCE_SHA"]], check=True)
          reports = list(pathlib.Path("app/build/test-results/testReleaseUnitTest").glob("TEST-*.xml"))
          if not reports:
              raise SystemExit("Unit test reports are missing")
          suites = [ET.parse(report).getroot() for report in reports]
          tests = sum(int(s.attrib["tests"]) for s in suites)
          failures = sum(int(s.attrib.get("failures", "0")) + int(s.attrib.get("errors", "0")) for s in suites)
          if failures or tests == 0:
              raise SystemExit("Unit tests did not pass")
          lint = ET.parse("app/build/reports/lint-results-release.xml").getroot()
          if any(i.attrib["severity"] in ("Error", "Fatal") for i in lint.findall("issue")):
              raise SystemExit("Lint errors found")
          notes_path = pathlib.Path(f"RELEASE_NOTES_{tag}.md")
          notes = notes_path.read_text() if notes_path.exists() else f"# 忆迹 {tag}\n"
          notes += f"\n\n## 本次正式发布构建\n\n源码提交：{os.environ['SOURCE_SHA']}。GitHub Actions 验证 {tests} 项 release 变体测试通过、Lint 无错误，APK 版本、固定签名及不可调试标记校验通过。\n\n签名证书 SHA-256：{os.environ['YIJI_SIGNING_CERTIFICATE_SHA256']}。与此前交付的 v2.1.0 及之后版本使用同一密钥。v2.0.0 及更早版本可能需要先备份后重新安装。\n\n本发布包为 release 构建，最终文件校验值以 SHA256SUMS.txt 为准。\n"
          notes_file = target / f"RELEASE_NOTES_{tag}.md"
          notes_file.write_text(notes, encoding="utf-8")
          assets = [apk, source, notes_file]
          (target / "SHA256SUMS.txt").write_text("".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in assets), encoding="utf-8")
          print(f"Prepared {len(assets) + 1} assets; {tests} tests passed.")
          PY

      - name: Upload assets and publish release
        if: steps.version.outputs.published != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ steps.version.outputs.sha }}
        shell: bash
        run: |
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --clobber
            gh release edit "$TAG" --notes-file "release-artifacts/RELEASE_NOTES_$TAG.md"
          else
            gh release create "$TAG" release-artifacts/* --draft \
              --target "$SOURCE_SHA" --title "忆迹 $TAG（正式版）" \
              --notes-file "release-artifacts/RELEASE_NOTES_$TAG.md"
          fi
          python3 - <<'PY'
          import json, os, re, subprocess
          tag = os.environ["TAG"]
          def version(value):
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", value)
              return tuple(map(int, match.groups())) if match else (-1, -1, -1)
          releases = json.loads(subprocess.check_output(["gh", "release", "list", "--limit", "100", "--json", "tagName,isDraft,isPrerelease"], text=True))
          newer = any(not r["isDraft"] and not r["isPrerelease"] and version(r["tagName"]) > version(tag) for r in releases)
          subprocess.run(["gh", "release", "edit", tag, "--draft=false", "--prerelease=false", "--latest=" + str(not newer).lower(),
              "--title", "忆迹 " + tag + "（正式版）"], check=True)
          PY

      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
            app/build/test-results/testReleaseUnitTest/

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/yiji-signing"
